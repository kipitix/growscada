# Example growctl manifest: seeds tags for a test environment, in the project
# growctl works in (the seeded "Main" here).
#   make build
#   bin/growctl/growctl apply -f tests/manifests/example_tags.yaml --project Main
# A manifest declares a tag's definition only: its state starts as its type's
# zero value with quality bad until a supplier (the device simulator) writes.
apiVersion: growscada/v0.3
kind: Tag
metadata:
  name: sim.pump1.running
spec:
  type: boolean
---
apiVersion: growscada/v0.3
kind: Tag
metadata:
  name: sim.pump1.speed
spec:
  type: integer
---
apiVersion: growscada/v0.3
kind: Tag
metadata:
  name: sim.pump1.mode
spec:
  type: string
