# The application for `make bruno_test`: a fresh database with migrations and
# seed (as `make db_up`, but without a volume), the server and the device
# simulator driving the seeded dashboard tags. The API (9090) and the
# simulator's control API (9191) are published for `bru` on the host; the
# healthchecks let `docker compose up --wait` return once both are ready.
name: growscada_bruno_test

# The image's entrypoint runs `goose -dir=/migrations up` whatever the
# command; GOOSE_EXTRA_ARGS goes before `up`.
x-goose: &goose
  image: kukymbr/goose-docker:3.27.0
  environment: &goose-env
    GOOSE_DRIVER: postgres
    GOOSE_DBSTRING: "postgres://growscada:growscada@db:5432/growscada?sslmode=disable"
  restart: "no"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: growscada
      POSTGRES_USER: growscada
      POSTGRES_PASSWORD: growscada
    # Over TCP: during the image's init the temporary server listens only on
    # the Unix socket, and the migrations connect over TCP.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U growscada -d growscada"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One chain per schema (ADR 0011): the server's public first, then the
  # roles', each recorded in its own goose table.
  db_migrations:
    <<: *goose
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../internal/server/infrastructure/postgres/migrations/public:/migrations:ro

  db_migrations_engineering:
    <<: *goose
    environment:
      <<: *goose-env
      GOOSE_EXTRA_ARGS: "-table=engineering.goose_db_version"
    depends_on:
      db_migrations:
        condition: service_completed_successfully
    volumes:
      - ../../internal/server/infrastructure/postgres/migrations/engineering:/migrations:ro

  db_migrations_runtime:
    <<: *goose
    environment:
      <<: *goose-env
      GOOSE_EXTRA_ARGS: "-table=runtime.goose_db_version"
    depends_on:
      db_migrations_engineering:
        condition: service_completed_successfully
    volumes:
      - ../../internal/server/infrastructure/postgres/migrations/runtime:/migrations:ro

  db_test_data:
    <<: *goose
    depends_on:
      db_migrations_runtime:
        condition: service_completed_successfully
    volumes:
      - ../../internal/server/infrastructure/postgres/test_data:/migrations:ro

  server:
    build:
      context: ../..
      target: server
    depends_on:
      db_test_data:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://growscada:growscada@db:5432/growscada?sslmode=disable"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/api/v0/projects"]
      interval: 2s
      timeout: 5s
      retries: 15

  # The seed creates no Deployment: its Runtime copies of the Tags and Devices
  # are inserted by test_data directly, so the stack would run on fixtures
  # alone. Publish the Draft of "Main" (the simulator's Device and the
  # dashboard's Tags) as a Commit and a Release and deploy that Release once,
  # as a real deployment would, before anything writes a Tag value or connects
  # a Device (task 35; task 72_4: a Deploy takes a Release).
  deploy:
    image: curlimages/curl:8.10.1
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        project=http://server:9090/api/v0/projects/b0000000-0000-4000-8000-000000000001
        version=$$(curl -fsS $$project/draft | sed 's/.*"version":\([0-9]*\).*/\1/')
        curl -fsS -X POST $$project/commits \
          -H 'Content-Type: application/json' \
          -d '{"version":'$$version',"title":"Seed","author":"seed"}' >/dev/null
        curl -fsS -X POST $$project/releases \
          -H 'Content-Type: application/json' \
          -d '{"commit":1,"author":"seed"}' >/dev/null
        curl -fsS -X POST $$project/releases/1/deploy >/dev/null
    restart: "no"

  simulator:
    build:
      context: ../..
      target: simulator
    depends_on:
      deploy:
        condition: service_completed_successfully
    environment:
      DEVSIM_SERVER: "http://server:9090"
    volumes:
      - ../device_simulator:/config:ro
    command: ["--config", "/config/seed_dashboard.yaml"]
    ports:
      - "9191:9191"
    # Healthy once connected: until its tags are resolved on the server the
    # tag calls of the control API answer 503.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9191/control/device | grep -q '\"state\":\"connected\"'"]
      interval: 2s
      timeout: 5s
      retries: 15
