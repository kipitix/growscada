info:
  name: post library editing lock hand over is gone
  type: http
  seq: 187

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/edit-lock/takeover
  auth: inherit

docs: |
  The forced hand-over route of a Library's editing lock is gone (ADR 0022): the route
  answers `410 Gone`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '410'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: application/problem+json
    - expression: 'res.body.status'
      operator: eq
      value: '410'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
