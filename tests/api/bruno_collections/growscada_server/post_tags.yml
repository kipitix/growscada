info:
  name: post tags
  type: http
  seq: 18

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/tags
  body:
    type: json
    data: |-
      {
        "name": "test",
        "type": "string",
        "value": "test",
        "quality": "good"
      }
  auth: inherit

docs: |
  A tag belongs to the project of the path (ADR 0006); its name is unique in
  that project (ADR 0003): creating a second tag with an existing name returns
  `409 Conflict` Problem Details (see "post tags duplicate name"). Another
  project may have a tag of the same name.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
