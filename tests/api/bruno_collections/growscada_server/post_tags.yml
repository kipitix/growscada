info:
  name: post tags
  type: http
  seq: 2

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/tags
  body:
    type: json
    data: |-
      {
        "name": "test",
        "type": "string",
        "value": "test",
        "quality": "good"
      }
  auth: inherit

docs: |
  A tag's name is unique (ADR 0003): creating a second tag with an existing
  name returns `409 Conflict` Problem Details (see "post tags duplicate name").

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
