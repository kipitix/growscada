info:
  name: post tags
  type: http
  seq: 26

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/tags
  body:
    type: json
    data: |-
      {
        "name": "test",
        "type": "string"
      }
  auth: inherit

docs: |
  A tag belongs to the project of the path (ADR 0006); its name is unique in
  that project (ADR 0003): creating a second tag with an existing name returns
  `409 Conflict` Problem Details (see "post tags duplicate name"). Another
  project may have a tag of the same name.

  The body is the tag's definition alone (ADR 0011): its state starts as its
  type's zero value (`""`, `false`, `0`) with quality `bad` until a supplier
  writes one (see "patch tag value"), and the tag accepts values as soon as
  this returns. A body with `value` or `quality` is `400 Bad Request`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
