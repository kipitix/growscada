info:
  name: put a label on a project saved state
  type: http
  seq: 2015
http:
  method: PUT
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/saved-states/1/labels/{{LABEL_ID}}
  auth: inherit

docs: |
  A label marks one saved state (task 85_3; ADR 0025). The request states no
  Draft Version and is idempotent: a repeat is a 200 with the same answer, never
  a 409. The answer is every label the saved state carries afterwards; the
  label was renamed and recolored by the label flow above.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.labels'
      operator: isArray
    - expression: 'res.body.labels.length'
      operator: eq
      value: '1'
    - expression: 'res.body.labels[0].id'
      operator: eq
      value: '"{{LABEL_ID}}"'
    - expression: 'res.body.labels[0].name'
      operator: eq
      value: '"Bruno label renamed"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
