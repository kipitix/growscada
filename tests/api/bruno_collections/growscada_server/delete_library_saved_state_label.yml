info:
  name: delete the label of a library saved state
  type: http
  seq: 2021
http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/libraries/{{OTHER_LIBRARY_ID}}/saved-states/1/labels/{{LABEL_ID}}
  auth: inherit

docs: |
  The label no longer marks the library's saved state (task 85_3; ADR 0025);
  the answer is the empty set of labels it still carries.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.labels.length'
      operator: eq
      value: '0'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
