info:
  name: get deployment by invalid number
  type: http
  seq: 49

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/deployments/abc
  auth: inherit

docs: |
  A deployment number that is not a number is `400 Bad Request` Problem
  Details: the path names the Deployment, and the API says which part is wrong.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '400'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: '"application/problem+json"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
