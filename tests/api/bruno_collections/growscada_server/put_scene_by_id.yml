info:
  name: put scene by id
  type: http
  seq: 28

http:
  method: PUT
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/scenes/{{SCENE_ID}}
  body:
    type: json
    data: |-
      {
        "name": "pump room updated",
        "width": 2560,
        "height": 1440,
        "background_html": "<div class=\"background pump-room updated\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"2560\" height=\"1440\"><rect width=\"100%\" height=\"100%\" fill=\"#0f3460\"/></svg></div>",
        "version": 3
      }
  auth: inherit

docs: |
  `version` is the scene version the edit is based on. A version other than
  the stored one returns `409 Conflict` (reload and retry); a negative one is
  no version at all and returns `400 Bad Request` naming `version`.

  The versions in this collection's bodies follow its run order (`seq`) on
  the seed data: each Widget change raises its Scene's version (1 → post
  widgets → 2 → put widget → 3 → put scene → 4).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: eq
      value: '4'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
