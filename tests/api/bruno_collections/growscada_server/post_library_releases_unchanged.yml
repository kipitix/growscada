info:
  name: post library releases unchanged
  type: http
  seq: 58

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/releases
  body:
    type: json
    data: |-
      {
        "commit": {{LIBRARY_RELEASE_COMMIT}},
        "author": "Bruno"
      }
  auth: inherit

docs: |
  One Commit is published at most once: a second Release of it is refused
  (task 72_5; ADR 0021).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '409'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: '"application/problem+json"'
    - expression: 'res.body.title'
      operator: eq
      value: '"Conflict: LibraryRelease"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
