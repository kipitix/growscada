info:
  name: get draft
  type: http
  seq: 33

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/draft
  auth: inherit

docs: |
  The state of the project's Draft (ADR 0016, task 74): its `version`, the one
  every write of the Draft's content states and every content DTO of the
  project carries, and `has_unsaved_changes`, the Draft's own flag that its
  Version is above its Clean Version. A project that does not exist answers
  `404`; a project never written has the version a fresh Draft starts at.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: gt
      value: '0'
    - expression: 'res.body.has_unsaved_changes'
      operator: isBoolean

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
