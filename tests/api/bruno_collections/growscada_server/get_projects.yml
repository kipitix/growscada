info:
  name: get projects
  type: http
  seq: 11

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects
  auth: inherit

docs: |
  The live projects of the server, in creation order. The seed has two: Main,
  with the demo content, and an empty one renamed and deleted below.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.projects'
      operator: isArray
    - expression: 'res.body.projects[0].name'
      operator: eq
      value: '"Main"'
    - expression: 'res.body.projects[0].description'
      operator: isString
    - expression: 'res.body.projects[0].has_unsaved_changes'
      operator: isBoolean

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
