info:
  name: post release deploy
  type: http
  seq: 43

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/releases/{{OTHER_RELEASE_NUMBER}}/deploy
  auth: inherit

docs: |
  The Release becomes the project's first Deployment (task 72_4). The number,
  the time and the Release are the Runtime node's; nothing of the Draft reaches
  it before this call, so writing a Tag value in a project that was never
  deployed answers `404`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '1'
    - expression: 'res.body.deployed_at'
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
