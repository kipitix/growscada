info:
  name: preview a Deployment whose Library Releases are not here
  type: http
  seq: 143

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/deploy/preview
  auth: inherit

docs: |
  The running Deployment was deployed from a foreign file and names a Library
  Release this server does not have: the preview names the pin as
  `missing_releases`, so the Project mode warns that a Discard would drop the
  widgets of that Release's WidgetTypes (task 71; ADR 0018). The Draft is left
  as it is: the Discard with the warning is exercised at the end of the
  collection, on a project of its own.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.missing_releases[0].library_id'
      operator: eq
      value: '"d0000000-0000-4000-8000-0000000000ff"'
    - expression: 'res.body.missing_releases[0].release'
      operator: eq
      value: '1'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
