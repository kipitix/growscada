info:
  name: get device by id
  type: http
  seq: 85

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/devices/{{DEVICE_ID}}
  auth: inherit

docs: |
  One Device of the project: its name, comment, protocol and the
  configuration read under it, with its Version — the one an update states.

  `404` for a Device that does not exist, or one of another project.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{DEVICE_ID}}"'
    - expression: 'res.body.name'
      operator: eq
      value: '"sim"'
    - expression: 'res.body.protocol'
      operator: eq
      value: '"simulation"'
    - expression: 'res.body.version'
      operator: gt
      value: '0'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
