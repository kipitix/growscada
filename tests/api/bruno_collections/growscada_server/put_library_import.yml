info:
  name: put library import
  type: http
  seq: 59
http:
  method: PUT
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/library-imports/{{OTHER_LIBRARY_ID}}
  body:
    type: json
    data: |-
      {
        "saved_state": 1,
        "version": 1
      }
  auth: inherit

docs: |
  `version` 0 adds the import (`201`); any other switches it and must be the
  import's current version (`200`).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.saved_state_number'
      operator: eq
      value: '1'
    - expression: 'res.body.version'
      operator: eq
      value: '2'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
