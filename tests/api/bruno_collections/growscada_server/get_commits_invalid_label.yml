info:
  name: get the project commits of an invalid label
  type: http
  seq: 2022
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/commits?label=not-a-uuid
  auth: inherit

docs: |
  The filter names a label by its UUID; a value that is not one is the client's
  input, answered 400 as Problem Details (task 85_3; ADR 0025).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '400'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: '"application/problem+json"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
