info:
  name: get library pins
  type: http
  seq: 16

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/library-pins
  auth: inherit

docs: |
  The Library Pins of the project: the release of each library it uses.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.library_pins'
      operator: isArray
    - expression: 'res.body.library_pins.length'
      operator: eq
      value: '2'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
