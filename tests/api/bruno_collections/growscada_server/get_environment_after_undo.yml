info:
  name: get environment after undo
  type: http
  seq: 122
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/environments/{{ENVIRONMENT_ID}}
  auth: inherit

docs: |
  The undo of "delete environment" wrote the before state of its change: the
  Environment `bench` is back, with the identity it had (ADR 0017).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{ENVIRONMENT_ID}}"'
    - expression: 'res.body.name'
      operator: eq
      value: '"bench"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
