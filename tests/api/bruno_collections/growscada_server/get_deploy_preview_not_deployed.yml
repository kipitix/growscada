info:
  name: get the draft before the deploy
  type: http
  seq: 40

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/draft
  auth: inherit

docs: |
  The Version of the project's Draft, which the Commit below states. A Deploy
  takes a Release since task 72_4: Save → Release → Deploy.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: gt
      value: '0'

  scripts:
    - type: after-response
      code: |-
        bru.setVar("OTHER_DRAFT_VERSION", res.body.version)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
