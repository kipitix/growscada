info:
  name: put widget type by id
  type: http
  seq: 23

http:
  method: PUT
  url: http://{{API_SERVER}}/api/v0/widget-types/{{WIDGET_TYPE_ID}}
  body:
    type: json
    data: |-
      {
        "name": "pressure gauge updated",
        "html_template": "<div class=\"gauge updated\"><span class=\"value\"></span></div>",
        "script": "function render(inputs) { document.querySelector('.value').textContent = inputs.pressure.value + ' bar'; }",
        "script_language": "javascript",
        "default_width": 200,
        "default_height": 200,
        "input_ports": [
          { "name": "pressure", "description": "Line pressure in bar", "type_hint": "integer" },
          { "name": "temperature", "description": "Fluid temperature", "type_hint": "integer" }
        ],
        "version": 1
      }
  auth: inherit

docs: |
  `version` is the widget type version the edit is based on. A version other than
  the stored one returns `409 Conflict` (reload and retry); a negative one is
  no version at all and returns `400 Bad Request` naming `version`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: eq
      value: '2'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
