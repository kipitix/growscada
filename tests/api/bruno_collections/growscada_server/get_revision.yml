info:
  name: get revision
  type: http
  seq: 42

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/revision
  auth: inherit

docs: |
  The Revision the project runs: its number, its deployment time and the
  ProjectFile it holds. Operation reads this document and nothing of the
  Draft; `404` means the project was never deployed.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '1'
    - expression: 'res.body.content.project_id'
      operator: eq
      value: '"{{OTHER_PROJECT_ID}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
