info:
  name: deploy the cleanup project with the pin
  type: http
  seq: 1990

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{CLEANUP_PROJECT_ID}}/releases/{{CLEANUP_RELEASE_NUMBER}}/deploy
  auth: inherit

docs: |
  Release 1 of the cleanup project names the release of the Legacy library in
  its ProjectFile: Deployment 1 now keeps the library from being deleted too
  (task 71; task 72_4).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '1'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
