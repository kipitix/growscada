info:
  name: deploy the cleanup project with the import
  type: http
  seq: 1991
http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{CLEANUP_PROJECT_ID}}/saved-states/{{CLEANUP_SAVED_STATE_NUMBER}}/deploy
  auth: inherit

docs: |
  Saved state 1 of the cleanup project names the saved state of the Legacy
  library in its ProjectFile: Deployment 1 now keeps the library from being
  deleted too (task 71; task 85_6).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '1'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
