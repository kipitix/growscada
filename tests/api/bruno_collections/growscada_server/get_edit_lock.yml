info:
  name: get edit lock (held)
  type: http
  seq: 9

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/edit-lock
  auth: inherit

docs: |
  The lock the setup took: held by the collection's client, 200 (ADR 0015).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.held'
      operator: eq
      value: 'true'
    - expression: 'res.body.holder.name'
      operator: eq
      value: '"bruno"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
