info:
  name: release the cleanup commit
  type: http
  seq: 1983

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{CLEANUP_PROJECT_ID}}/releases
  body:
    type: json
    data: |-
      {
        "commit": {{CLEANUP_COMMIT_NUMBER}},
        "author": "Ada"
      }
  auth: inherit

docs: |
  Commit 1 becomes Release 1, which names the Legacy library's release in its
  copied ProjectFile (task 71; task 72_4).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined

  scripts:
    - type: after-response
      code: |-
        bru.setVar("CLEANUP_RELEASE_NUMBER", res.body.number)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
