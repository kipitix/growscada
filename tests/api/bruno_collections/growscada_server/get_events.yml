info:
  name: get events (SSE stream)
  type: http
  seq: 35
  tags:
    - manual

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/events
  auth: inherit

docs: |
  Opens the server's Server-Sent Events stream: the events of the server's
  own resources (project and widget-type created/updated/deleted), plus
  client_connected/client_disconnected and system_ready. The events of a
  project's content (tags, scenes, widgets) go to the project's stream, see
  "get project events"; `?project=<project uuid>` joins them to this stream,
  so one connection carries both (the UI's). A project not found (e.g.
  deleted) adds nothing; an invalid UUID is a `400`. The type names are the constants of
  contract/api/v0. One connection per client, no history replay — only
  events published after connecting are sent.

  Bruno sends the request and waits for the response body, so it will hang
  until the connection is closed (the stream never completes on its own);
  cancel the request manually to inspect what was received so far. Each
  message is a single SSE `data:` line containing JSON:
  `{"type":"tag_created","timestamp":"2026-01-01T12:00:00Z","id":"<uuid>"}`.

  `system_ready` carries no `id`.

  `widget_created`, `widget_updated` and `widget_deleted` additionally carry
  the ID of the Scene that holds (or held) the Widget in `scene_id`:
  `{"type":"widget_updated","timestamp":"2026-01-01T12:00:00Z","id":"<widget uuid>","scene_id":"<scene uuid>"}`.

  `tag_updated` additionally carries the Tag's full new state in `tag`, in
  the same shape as `GET /api/v0/projects/{project}/tags/{id}`, so clients need not read it back:
  `{"type":"tag_updated","timestamp":"2026-01-01T12:00:00Z","id":"<uuid>","tag":{"id":"<uuid>","name":"pressure","type":"integer","value":"42","quality":"good","version":3}}`.

  The server caps the number of concurrent event streams (configurable via
  the MAX_SSE_CLIENTS env var, default 100). Once at capacity, a new request
  gets a 503 Problem Details response (`application/problem+json`) instead
  of an SSE stream.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
