info:
  name: deploy a project file as a Deployment
  type: http
  seq: 140

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/projectfile/deploy
  body:
    type: json
    data: |-
      {
        "schema_version": "0.2",
        "project_id": "{{PROJECT_ID}}"
      }
  auth: inherit

docs: |
  A file becomes a Release with origin file and a new Deployment without the
  Draft (task 72_4): the Deployment's document is the one sent. The Draft keeps
  its Version.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '3'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
