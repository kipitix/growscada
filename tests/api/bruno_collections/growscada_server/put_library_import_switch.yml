info:
  name: put library import switch
  type: http
  seq: 66
http:
  method: PUT
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/library-imports/{{LIBRARY_ID}}
  body:
    type: json
    data: |-
      {
        "saved_state": 2,
        "version": 2
      }
  auth: inherit

docs: |
  Switches the import to another saved state. A switch that would leave Widgets
  without their WidgetType returns `409` naming them in `orphaned_widgets`;
  the PortBindings it breaks are removed after it.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.saved_state_number'
      operator: eq
      value: '2'
    - expression: 'res.body.version'
      operator: eq
      value: '3'
    - expression: 'res.body.title'
      operator: eq
      value: '"Widgets for import"'
    - expression: 'res.body.author'
      operator: eq
      value: '"Bruno"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
