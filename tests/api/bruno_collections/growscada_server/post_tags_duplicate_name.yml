info:
  name: post tags duplicate name
  type: http
  seq: 19

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/tags
  body:
    type: json
    data: |-
      {
        "name": "is_active",
        "type": "boolean",
        "value": "false",
        "quality": "good"
      }
  auth: inherit

docs: |
  A tag's name is unique in its project (ADR 0003). `is_active` already
  exists in the seeded project Main, so this request returns `409 Conflict`
  Problem Details.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '409'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: '"application/problem+json"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
