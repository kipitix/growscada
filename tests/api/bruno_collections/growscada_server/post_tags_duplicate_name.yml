info:
  name: post tags duplicate name
  type: http
  seq: 26

http:
  method: POST
  url: http://{{API_SERVER}}/api/v1/tags
  body:
    type: json
    data: |-
      {
        "name": "is_active",
        "type": "boolean",
        "value": "false",
        "quality": "good"
      }
  auth: inherit

docs: |
  A tag's name is unique (ADR 0003). `is_active` already exists in the seed
  data, so this request returns `409 Conflict` Problem Details.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
