info:
  name: get revisions after rollback
  type: http
  seq: 62

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/revisions
  auth: inherit

docs: |
  The Rollback appended Revision 3; the two before it are still there, newest
  first. A rollback names the Revision it copied; a deploy names nothing.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.revisions.length'
      operator: eq
      value: '3'
    - expression: 'res.body.revisions[0].number'
      operator: eq
      value: '3'
    - expression: 'res.body.revisions[0].cause'
      operator: eq
      value: '"rollback"'
    - expression: 'res.body.revisions[0].rolled_back_from'
      operator: eq
      value: '1'
    - expression: 'res.body.revisions[1].number'
      operator: eq
      value: '2'
    - expression: 'res.body.revisions[1].cause'
      operator: eq
      value: '"deploy"'
    - expression: 'res.body.revisions[2].number'
      operator: eq
      value: '1'
    - expression: 'res.body.revisions[2].cause'
      operator: eq
      value: '"deploy"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
