info:
  name: deploy a file whose library is not here
  type: http
  seq: 2000
http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{CLEANUP_PROJECT_ID}}/projectfile/deploy
  body:
    type: json
    data: |-
      {
        "schema_version": "0.2",
        "project_id": "{{CLEANUP_PROJECT_ID}}",
        "library_pins": [
          {
            "library_id": "d0000000-0000-4000-8000-0000000000ff",
            "release": 1
          }
        ],
        "widget_types": [
          {
            "id": "a1b2c3d4-00ff-4000-8000-0000000000f1",
            "library_id": "d0000000-0000-4000-8000-0000000000ff",
            "name": "foreign gauge",
            "html_template": "<div class=\"gauge\"></div>",
            "script": "function render(inputs) {}",
            "script_language": "javascript",
            "default_width": 10,
            "default_height": 10,
            "input_ports": []
          }
        ],
        "scenes": [
          {
            "id": "c1d2e3f4-00ff-4000-8000-0000000000f1",
            "name": "foreign scene",
            "width": 100,
            "height": 100,
            "background_html": "",
            "widgets": [
              {
                "id": "b1c2d3e4-00ff-4000-8000-0000000000f1",
                "name": "foreign widget",
                "position": { "x": 0.0, "y": 0.0, "z": 0 },
                "size": { "width": 10, "height": 10 },
                "origin": { "x": 0.5, "y": 0.5 },
                "rotation": { "degrees": 0.0 },
                "type_id": "a1b2c3d4-00ff-4000-8000-0000000000f1",
                "labels": [],
                "port_bindings": []
              }
            ]
          }
        ]
      }
  auth: inherit

docs: |
  A file from another server: its document is self-contained (the WidgetType
  copy, the scene and the widget are in it), so it is deployed as Deployment 3
  of Line 4 without asking for the library (task 39; ADR 0018). The pin it
  names is what a Discard cannot write here.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '3'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
