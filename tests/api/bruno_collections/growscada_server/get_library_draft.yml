info:
  name: get library draft
  type: http
  seq: 25

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/draft
  auth: inherit

docs: |
  The Version of the library's Draft: the one every write of its content
  states and every DTO of it carries (ADR 0016). A Library's own `version` is
  its lifecycle's (rename and deletion), a different number.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: eq
      value: '1'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
