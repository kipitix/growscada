info:
  name: post widgets
  type: http
  seq: 40

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/scenes/{{SCENE_ID}}/widgets
  body:
    type: json
    data: |-
      {
        "name": "status-circle",
        "position": { "x": 100.0, "y": 200.0, "z": 0 },
        "size": { "width": 80, "height": 80 },
        "origin": { "x": 0.5, "y": 0.5 },
        "rotation": { "degrees": 0.0 },
        "type_id": "{{WIDGET_TYPE_ID}}",
        "labels": ["indicator", "status"],
        "port_bindings": [
          { "port_name": "state", "tag_id": "{{BOOLEAN_TAG_ID}}" }
        ],
        "scene_version": 1
      }
  auth: inherit

docs: |
  The versions in this collection's bodies follow its run order (`seq`) on
  the seed data: each Widget change raises its Scene's version (1 → post
  widgets → 2 → put widget → 3 → put scene → 4).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: isString
    - expression: 'res.body.scene_version'
      operator: eq
      value: '2'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
