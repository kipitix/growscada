info:
  name: deploy a missing release
  type: http
  seq: 50

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/releases/99/deploy
  auth: inherit

docs: |
  A Release number the project does not have is `404 Not Found`, and the answer
  names the Release (task 72_4).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '404'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: '"application/problem+json"'
    - expression: 'res.body.detail'
      operator: contains
      value: '99'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
