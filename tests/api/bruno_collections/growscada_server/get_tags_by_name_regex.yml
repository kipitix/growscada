info:
  name: get tags by name regex
  type: http
  seq: 4

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/tags?name_regex=^(is|enable)_
  auth: inherit

docs: |
  Filters tags by a Go (RE2) regular expression matched anywhere in the name;
  anchor it with `^` and `$` for a whole-name match, `(?i)` makes it
  case-insensitive. The response has the same shape as `GET /tags`:
  `{"tags":[...]}` with any number of tags.

  An invalid expression returns 400 Problem Details. Only one of `name`,
  `name_pattern`, `name_regex` may be given, otherwise 400.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.tags[0].name'
      operator: matches
      value: '^(is|enable)_'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
