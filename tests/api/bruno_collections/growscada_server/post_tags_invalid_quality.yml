info:
  name: post tags invalid quality
  type: http
  seq: 21

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/tags
  body:
    type: json
    data: |-
      {
        "name": "invalid_quality",
        "type": "boolean",
        "value": "false",
        "quality": "simulated"
      }
  auth: inherit

docs: |
  "simulated" is not a Quality (only bad, uncertain, good). Any value the
  server cannot accept from a request body returns `400 Bad Request` Problem
  Details naming the cause.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '400'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: '"application/problem+json"'
    - expression: 'res.body.detail'
      operator: contains
      value: '"quality"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
