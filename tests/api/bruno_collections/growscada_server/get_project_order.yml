info:
  name: get project order
  type: http
  seq: 9

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/settings/project-order
  auth: inherit

docs: |
  The project order of the person the server acts for (task 83; ADR 0024).
  It is a per-user setting of its own, apart from the library order and from
  the projects it orders: an empty list at version 0 is a person who never
  reordered, never a 404.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.project_ids'
      operator: isArray
    - expression: 'res.body.project_ids.length'
      operator: eq
      value: '0'
    - expression: 'res.body.version'
      operator: eq
      value: '0'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
