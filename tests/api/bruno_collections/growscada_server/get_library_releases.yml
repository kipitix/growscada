info:
  name: get library releases
  type: http
  seq: 14

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/releases
  auth: inherit

docs: |
  The library's releases, oldest first, each with the copies of the
  WidgetTypes it holds.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.releases'
      operator: isArray
    - expression: 'res.body.releases[0].number'
      operator: eq
      value: '1'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
