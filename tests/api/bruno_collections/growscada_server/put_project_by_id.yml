info:
  name: put project by id
  type: http
  seq: 73
http:
  method: PUT
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}
  body:
    type: json
    data: |-
      {
        "name": "Line 3",
        "description": "Second line",
        "version": 1
      }
  auth: inherit

docs: |
  Updates a project's name and description (task 73). `version` is the version
  the update is based on; another one returns `409 Conflict` (reload and
  retry). An absent `description` keeps the current one.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: eq
      value: '2'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
