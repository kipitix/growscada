info:
  name: get environments
  type: http
  seq: 87
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/environments
  auth: inherit

docs: |
  The Environments of the project's Draft, in creation order: named sets of
  the project's Devices as they stand in one context of operation. A Deploy does
  not choose one; a Device Gateway names the one it serves.

  The seeded project Main has one Environment, `bench`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.environments'
      operator: isArray
    - expression: 'res.body.environments[0].id'
      operator: eq
      value: '"{{ENVIRONMENT_ID}}"'
    - expression: 'res.body.environments[0].name'
      operator: eq
      value: '"bench"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
