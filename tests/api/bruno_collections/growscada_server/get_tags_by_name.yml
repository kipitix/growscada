info:
  name: get tags by name
  type: http
  seq: 5

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/tags?name=creator
  auth: inherit

docs: |
  Filters the tag list by the tag's unique name (ADR 0003). The response has
  the same shape as `GET /tags` and holds 0 or 1 tags: `{"tags":[...]}`.
  No match is `200` with an empty list, not `404`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.tags[0].name'
      operator: eq
      value: '"creator"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
