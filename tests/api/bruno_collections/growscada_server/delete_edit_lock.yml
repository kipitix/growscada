info:
  name: delete edit lock (check in)
  type: http
  seq: 6

http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/edit-lock
  headers:
    - name: X-GrowSCADA-Client
      value: "{{CLIENT_KEY}}"
  auth: inherit

docs: |
  Check in: gives the Draft back, leaving it and its changes as they are
  (ADR 0015). 200 with the free lock; the version grows, so a client tells a
  stale observation from a fresh one.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.held'
      operator: eq
      value: 'false'
    - expression: 'res.body.version'
      operator: eq
      value: '4'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
