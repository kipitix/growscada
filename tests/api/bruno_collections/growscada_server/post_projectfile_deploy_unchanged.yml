info:
  name: deploy the same project file again
  type: http
  seq: 142
http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/projectfile/deploy
  body:
    type: json
    data: |-
      {
        "schema_version": "0.2",
        "project_id": "{{PROJECT_ID}}"
      }
  auth: inherit

docs: |
  Every file deploy publishes a Release (task 72_4), so the same document is a
  new Deployment even though its content did not change.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '4'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
