info:
  name: deploy the project file the Revision already is
  type: http
  seq: 141

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/projectfile/deploy
  headers:
    - name: X-GrowSCADA-Client
      value: "{{CLIENT_KEY}}"
  body:
    type: json
    data: |-
      {
        "schema_version": "0.2",
        "project_id": "{{PROJECT_ID}}"
      }
  auth: inherit

docs: |
  The document is the Revision the project runs: `409 nothing_to_deploy`, as a
  Deploy of an unchanged Draft (ADR 0018).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '409'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: application/problem+json
    - expression: 'res.body.detail'
      operator: contains
      value: Nothing to deploy

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
