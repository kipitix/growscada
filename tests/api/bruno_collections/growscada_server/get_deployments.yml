info:
  name: get deployments
  type: http
  seq: 46

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/deployments
  auth: inherit

docs: |
  The Deployments of the project, newest first, without their documents: the
  number, the deployment time and why each exists (`deploy` or `rollback`).
  The project was deployed once just before, so the list holds exactly that
  Deployment.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.deployments'
      operator: isArray
    - expression: 'res.body.deployments.length'
      operator: eq
      value: '1'
    - expression: 'res.body.deployments[0].number'
      operator: eq
      value: '1'
    - expression: 'res.body.deployments[0].cause'
      operator: eq
      value: '"deploy"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
