info:
  name: get widget type by id
  type: http
  seq: 7

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/widget-types/{{WIDGET_TYPE_ID}}
  auth: inherit

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{WIDGET_TYPE_ID}}"'
    - expression: 'res.body.name'
      operator: eq
      value: '"Boolean Circle"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
