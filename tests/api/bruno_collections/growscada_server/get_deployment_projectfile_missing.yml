info:
  name: get a missing deployment as a project file
  type: http
  seq: 137
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/deployments/99/projectfile
  auth: inherit

docs: |
  A Deployment number the project does not have is `404`: a file cannot be
  downloaded for a Deployment that is not there (ADR 0018).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '404'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: application/problem+json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
