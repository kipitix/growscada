info:
  name: delete library by id
  type: http
  seq: 82
http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/libraries/{{OTHER_LIBRARY_ID}}
  auth: inherit

docs: |
  Refused (`409`) while a running Deployment of a live project names one of the
  library's releases: the project Main pinned it in the seed, and the first
  Deployment — the one the server made at start — still names it, though the
  pin is gone from the Draft. A Discard of that Deployment could not restore
  the Release, so the library stays (task 71; ADR 0007).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '409'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: application/problem+json
    - expression: 'res.body.detail'
      operator: contains
      value: running Deployment

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
