info:
  name: get pre-versioning path
  type: http
  seq: 28

http:
  method: GET
  url: http://{{API_SERVER}}/api/v1/tags
  auth: inherit

docs: |
  `/api/v1` is where the API lived before contract versioning (ADR 0005); its
  shapes are today's v0. Any method under it answers `410 Gone` with a Problem
  Details body pointing to `/api/v0`. The route goes away when the API reaches
  1.0 and the path takes its real meaning.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
