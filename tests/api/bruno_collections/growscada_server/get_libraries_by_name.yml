info:
  name: get libraries by name
  type: http
  seq: 10

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/libraries?name=Extras
  auth: inherit

docs: |
  `?name=` selects the library with that exact name: the list holds 0 or 1
  libraries.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.libraries.length'
      operator: eq
      value: '1'
    - expression: 'res.body.libraries[0].id'
      operator: eq
      value: '"{{OTHER_LIBRARY_ID}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
