info:
  name: post library discard
  type: http
  seq: 77

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/discard
  headers:
    - name: X-GrowSCADA-Client
      value: "{{CLIENT_KEY}}"
  auth: inherit

docs: |
  Resets the Draft to the latest release in one transaction over the Draft and
  answers the Draft's new state (ADR 0016).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: eq
      value: '5'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
