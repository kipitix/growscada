info:
  name: post library discard
  type: http
  seq: 78
http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/discard
  auth: inherit

docs: |
  Resets the Draft to its last Commit — dropping the unsaved changes — in one
  transaction over the Draft and answers the Draft's new state (task 72_5;
  ADR 0016). The Draft is then its Clean Version: `has_unsaved_changes` is
  false (task 74). The latest Release is the target of revert-to-release
  instead.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: eq
      value: '5'
    - expression: 'res.body.has_unsaved_changes'
      operator: eq
      value: 'false'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
