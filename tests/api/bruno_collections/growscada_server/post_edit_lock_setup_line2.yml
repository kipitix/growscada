info:
  name: post edit lock setup (project Line 2)
  type: http
  seq: 10

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/edit-lock
  headers:
    - name: X-GrowSCADA-Client
      value: "{{CLIENT_KEY}}"
  body:
    type: json
    data: |-
      {
        "name": "bruno"
      }
  auth: inherit

docs: |
  Setup of the deploy section: the requests that deploy the empty project
  Line 2 act as this client, so it checks that Draft out too (ADR 0015). The
  teardown gives it back.

runtime:
  assertions:
    - expression: 'res.status'
      operator: in
      value: '[200, 201]'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.held'
      operator: eq
      value: 'true'
    - expression: 'res.body.holder.key'
      operator: eq
      value: '"{{CLIENT_KEY}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
