info:
  name: get library by id
  type: http
  seq: 21

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}
  auth: inherit

docs: |
  `latest_release` is the number of the latest Library Release (0 for none),
  `latest_commit` that of the last Commit; `has_unsaved_changes` tells whether
  the Draft moved since that Commit, `has_unpublished_changes` whether the
  Commit was released (task 72_5). `version` is the Library's own (rename and
  deletion); the Version of its Draft is GET /libraries/{id}/draft.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{LIBRARY_ID}}"'
    - expression: 'res.body.description'
      operator: isString
    - expression: 'res.body.latest_release'
      operator: eq
      value: '1'
    - expression: 'res.body.latest_commit'
      operator: eq
      value: '0'
    - expression: 'res.body.has_unsaved_changes'
      operator: eq
      value: 'true'
    - expression: 'res.body.has_unpublished_changes'
      operator: eq
      value: 'false'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
