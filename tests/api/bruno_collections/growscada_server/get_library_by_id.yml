info:
  name: get library by id
  type: http
  seq: 21

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}
  auth: inherit

docs: |
  `latest_commit` is the number of the last Commit (0 for none) and
  `has_unsaved_changes` tells whether the Draft moved since it (task 74,
  task 85_7). `version` is the Library's own (rename and deletion); the Version
  of its Draft is GET /libraries/{id}/draft.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{LIBRARY_ID}}"'
    - expression: 'res.body.description'
      operator: isString
    - expression: 'res.body.latest_commit'
      operator: eq
      value: '1'
    - expression: 'res.body.has_unsaved_changes'
      operator: eq
      value: 'false'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
