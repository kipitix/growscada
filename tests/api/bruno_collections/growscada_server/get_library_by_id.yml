info:
  name: get library by id
  type: http
  seq: 11

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}
  auth: inherit

docs: |
  `latest_release` is the number of the latest Library Release (0 for none);
  `has_unreleased_changes` tells whether the Draft differs from it;
  `discarding_to`, present only while a Discard is under way, the release the
  Draft is being reset to.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{LIBRARY_ID}}"'
    - expression: 'res.body.latest_release'
      operator: eq
      value: '1'
    - expression: 'res.body.has_unreleased_changes'
      operator: eq
      value: 'false'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
