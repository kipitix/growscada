info:
  name: delete edit lock (free, idempotent)
  type: http
  seq: 7

http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/edit-lock
  headers:
    - name: X-GrowSCADA-Client
      value: "{{CLIENT_KEY}}"
  auth: inherit

docs: |
  A Check in of a free lock is 200: the desired state is reached. Another
  client's lock is `409`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.body.held'
      operator: eq
      value: 'false'
    - expression: 'res.body.version'
      operator: eq
      value: '3'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
