info:
  name: post project draft changes redo
  type: http
  seq: 123
http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/draft-changes/redo
  body:
    type: json
    data: |-
      {
        "version": 23
      }
  auth: inherit

docs: |
  Redo applies the after states of the change after the stack's position: the
  Environment goes again and the position steps forward (ADR 0017).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: eq
      value: '24'
    - expression: 'res.body.can_undo'
      operator: eq
      value: 'true'
    - expression: 'res.body.can_redo'
      operator: eq
      value: 'false'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
