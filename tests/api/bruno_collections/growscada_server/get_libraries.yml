info:
  name: get libraries
  type: http
  seq: 19

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/libraries
  auth: inherit

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.libraries'
      operator: isArray
    - expression: 'res.body.libraries[0].description'
      operator: isString
    - expression: 'res.body.libraries[0].has_unsaved_changes'
      operator: isBoolean

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
