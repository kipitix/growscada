info:
  name: get labels
  type: http
  seq: 2010

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/labels
  auth: inherit

docs: |
  The labels of the Organization (task 85_2; ADR 0025), ordered by name
  ignoring case. The migrations seed `ready_for_import` and
  `ready_for_deploy`; they are ordinary labels.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.labels'
      operator: isArray
    # The migrations seed these two, ordered by name ignoring case; the flow
    # creates its own label after this read (task 85_2; ADR 0025).
    - expression: 'res.body.labels[0].name'
      operator: eq
      value: '"ready_for_deploy"'
    - expression: 'res.body.labels[1].name'
      operator: eq
      value: '"ready_for_import"'
    - expression: 'res.body.labels[0].assigned_count'
      operator: eq
      value: '0'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
