info:
  name: patch tag value
  type: http
  seq: 5

http:
  method: PATCH
  url: http://{{API_SERVER}}/api/v0/tags/{{TAG_ID}}/value
  body:
    type: json
    data: |-
      {
        "value": "42",
        "quality": "good",
        "version": 1
      }
  auth: inherit

docs: |
  `version` is the tag version the update is based on (from `get tag by id` or
  the previous update's response, which returns the new one). A version other
  than the stored one, including a missing `version`, returns `409 Conflict`
  (reload and retry).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
