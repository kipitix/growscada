info:
  name: patch tag value
  type: http
  seq: 51

http:
  method: PATCH
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/tags/{{TAG_ID}}/value
  headers:
    - name: X-GrowSCADA-Client
      value: "{{CLIENT_KEY}}"
  body:
    type: json
    data: |-
      {
        "value": "42",
        "quality": "good"
      }
  auth: inherit

docs: |
  A write of the tag's state on the Runtime node (ADR 0011). It states no
  version and never returns `409 Conflict`: a tag's state has a single writer
  (its Device, or people), and the latest write wins. The response carries
  `seq`, the Journal position of the state: a change takes a position above
  every one before it and publishes `tag_updated` with the same, while a
  repeat of the stored value and Quality keeps the previous `seq` and only
  moves `written_at` (ADR 0019). A body with `version` is `400 Bad Request`
  (unknown field).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.seq'
      operator: isNumber
    - expression: 'res.body.written_at'
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
