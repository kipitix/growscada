info:
  name: patch tag value
  type: http
  seq: 22

http:
  method: PATCH
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/tags/{{TAG_ID}}/value
  body:
    type: json
    data: |-
      {
        "value": "42",
        "quality": "good"
      }
  auth: inherit

docs: |
  A write of the tag's state on the Runtime node (ADR 0011). It states no
  version and never returns `409 Conflict`: a tag's state has a single writer
  (its Device, or people), and the latest write wins. The response carries
  `seq`, the number the write took: each write's is above every one before
  it, and the `tag_updated` event of the write carries the same, so a reader
  keeps, of two states of one tag, the one with the greater `seq`. A body
  with `version` is `400 Bad Request` (unknown field).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.seq'
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
