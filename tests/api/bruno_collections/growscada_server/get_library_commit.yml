info:
  name: get one library commit with its widget types
  type: http
  seq: 167

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/commits/1
  auth: inherit

docs: |
  One Commit of the library's Draft: the history row plus the WidgetTypes its
  snapshot holds (task 72_2; ADR 0021).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.widget_types'
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
