info:
  name: get environment by id
  type: http
  seq: 67

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/environments/{{ENVIRONMENT_ID}}
  auth: inherit

docs: |
  One Environment of the project, with its Version. `404` for one that does
  not exist or belongs to another project.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{ENVIRONMENT_ID}}"'
    - expression: 'res.body.name'
      operator: eq
      value: '"bench"'
    - expression: 'res.body.version'
      operator: eq
      value: '1'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
