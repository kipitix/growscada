info:
  name: get the library commits
  type: http
  seq: 167
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/libraries/{{OTHER_LIBRARY_ID}}/commits
  auth: inherit

docs: |
  The history of the library's Draft, newest first, without content
  (task 72_2; ADR 0021).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.commits[0].number'
      operator: eq
      value: '1'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
