info:
  name: get library imports
  type: http
  seq: 26

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/library-imports
  auth: inherit

docs: |
  The Library Imports of the project: the saved state of each library it uses.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.library_imports'
      operator: isArray
    - expression: 'res.body.library_imports.length'
      operator: eq
      value: '2'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
