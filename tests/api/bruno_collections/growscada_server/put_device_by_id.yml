info:
  name: put device by id
  type: http
  seq: 96

http:
  method: PUT
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/devices/{{DEVICE_ID}}
  headers:
    - name: X-GrowSCADA-Client
      value: "{{CLIENT_KEY}}"
  body:
    type: json
    data: |-
      {
        "name": "sim",
        "comment": "renamed by the Bruno collection",
        "protocol": "simulation",
        "config": {"patterns": []},
        "version": 12
      }
  auth: inherit

docs: |
  Changes the Device, expecting the Version it was read at: the body carries
  `version`, and a stale one is `409 Conflict`. The response carries the new
  Version.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: eq
      value: '13'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
