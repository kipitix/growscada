info:
  name: get the library commits of the seeded saved state
  type: http
  seq: 165
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/libraries/{{OTHER_LIBRARY_ID}}/commits
  auth: inherit

docs: |
  The seed saves each Library once (task 85_6): the Library's list holds that
  one saved state, and the Draft is at its Clean Version (task 72_2;
  ADR 0021).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.commits'
      operator: isArray
    - expression: 'res.body.commits.length'
      operator: eq
      value: '1'
    - expression: 'res.body.commits[0].number'
      operator: eq
      value: '1'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
