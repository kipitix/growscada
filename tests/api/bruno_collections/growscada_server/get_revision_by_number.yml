info:
  name: get revision by number
  type: http
  seq: 37

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/revisions/1
  auth: inherit

docs: |
  One Revision of the project with the ProjectFile it holds: the same shape
  `GET …/revision` serves for the running one, plus the cause. A number the
  project does not have is `404`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '1'
    - expression: 'res.body.cause'
      operator: eq
      value: '"deploy"'
    - expression: 'res.body.content.project_id'
      operator: eq
      value: '"{{OTHER_PROJECT_ID}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
