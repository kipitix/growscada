info:
  name: post library edit lock takeover back
  type: http
  seq: 80

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/edit-lock/takeover
  headers:
    - name: X-GrowSCADA-Client
      value: "{{CLIENT_KEY}}"
  body:
    type: json
    data: |-
      {
        "name": "bruno",
        "version": 2
      }
  auth: inherit

docs: |
  The client that writes the library section takes its Draft back from the
  takeover above, stating the version it observed (ADR 0015): 200 with the
  lock at its next version.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.holder.key'
      operator: eq
      value: '"{{CLIENT_KEY}}"'
    - expression: 'res.body.version'
      operator: eq
      value: '3'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
