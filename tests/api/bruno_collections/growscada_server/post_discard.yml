info:
  name: post discard to the last commit
  type: http
  seq: 74
http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/discard
  auth: inherit

docs: |
  Discard resets the whole Draft to its last Commit — the unsaved changes go —
  in one transaction (task 72_4; ADR 0016): the answer is `200` with the
  Draft's new `version`. A project with no Commit answers `409`
  `nothing_to_discard`; its Revert-to-deployed restores the running
  Deployment.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: gt
      value: '0'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
