info:
  name: post discard
  type: http
  seq: 73

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/discard
  auth: inherit

docs: |
  Resets the whole Draft to the Revision the project runs, in one transaction
  (ADR 0016): the answer is `200` with the Draft's new `version`. A project
  that was never deployed answers `409`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: eq
      value: '4'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
