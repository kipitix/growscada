info:
  name: deploy the second saved state
  type: http
  seq: 63
http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/commits/{{OTHER_COMMIT_NUMBER}}/deploy
  auth: inherit

docs: |
  Saved state 2 is made the running Deployment: Deployment 2, which a Rollback
  can then leave behind (task 85_4).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '2'
    - expression: 'res.body.deployed_at'
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
