info:
  name: post deployment rollback
  type: http
  seq: 61

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/deployments/1/rollback
  auth: inherit

docs: |
  Makes the document of Deployment 1 the project's running configuration as a
  new Deployment: history is not rewritten, and the answer names the new number,
  the cause `rollback` and the Deployment it copied. The Draft is not read.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '3'
    - expression: 'res.body.cause'
      operator: eq
      value: '"rollback"'
    - expression: 'res.body.rolled_back_from'
      operator: eq
      value: '1'
    - expression: 'res.body.deployed_at'
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
