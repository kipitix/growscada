info:
  name: put library pin switch
  type: http
  seq: 38

http:
  method: PUT
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/library-pins/{{LIBRARY_ID}}
  body:
    type: json
    data: |-
      {
        "release": 2,
        "version": 1
      }
  auth: inherit

docs: |
  Switches the pin to another release. A switch that would leave Widgets
  without their WidgetType returns `409` naming them in `orphaned_widgets`;
  the PortBindings it breaks are removed after it.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.release'
      operator: eq
      value: '2'
    - expression: 'res.body.version'
      operator: eq
      value: '2'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
