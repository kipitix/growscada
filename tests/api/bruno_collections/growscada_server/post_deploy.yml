info:
  name: post deploy
  type: http
  seq: 41

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/deploy
  auth: inherit

docs: |
  Deploys the Draft, making it the project's first Revision. The number and
  the deployment time are the Runtime node's; nothing of the Draft reaches it
  before this call, so writing a Tag value in a project that was never
  deployed answers `404`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '1'
    - expression: 'res.body.deployed_at'
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
