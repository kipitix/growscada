info:
  name: save the library draft without changes
  type: http
  seq: 166
http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/libraries/{{OTHER_LIBRARY_ID}}/commits
  body:
    type: json
    data: |-
      {
        "version": {{LIBRARY_COMMIT_VERSION}},
        "title": "Widgets before the demo",
        "author": "Ada"
      }
  auth: inherit

docs: |
  The seeded Library sits at its saved state 1 (task 85_6): a Save finds the
  Draft at its Clean Version and refuses it with `409 nothing_to_save`, because
  there is nothing the last saved state does not hold (task 74; ADR 0021).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '409'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: '"application/problem+json"'
    - expression: 'res.body.status'
      operator: eq
      value: '409'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
