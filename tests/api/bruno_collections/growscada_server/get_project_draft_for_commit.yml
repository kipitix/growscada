info:
  name: get the project draft version for a commit
  type: http
  seq: 154

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/draft
  auth: inherit

docs: |
  Reads the Version of the project's Draft that the Save requests state
  (ADR 0016). `PROJECT_COMMIT_VERSION` carries it to the requests that
  follow.

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("PROJECT_COMMIT_VERSION", res.body.version);
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
