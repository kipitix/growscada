info:
  name: get the project commits before the save of the draft
  type: http
  seq: 156
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/commits
  auth: inherit

docs: |
  A Project never saved has no Commits: the list is empty (task 72_2;
  ADR 0021).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.commits'
      operator: isArray
    - expression: 'res.body.commits.length'
      operator: eq
      value: '1'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
