info:
  name: delete edit lock is gone
  type: http
  seq: 182

http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/edit-lock
  auth: inherit

docs: |
  A Check in is gone with the EditLock (ADR 0022): the route answers `410
  Gone`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '410'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.status'
      operator: eq
      value: '410'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
