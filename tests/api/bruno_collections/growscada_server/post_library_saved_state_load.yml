info:
  name: load a saved state into the library draft
  type: http
  seq: 2004

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/libraries/{{OTHER_LIBRARY_ID}}/saved-states/1/load
  auth: inherit

docs: |
  The same reset for a Library (task 84): its Draft becomes the WidgetTypes the
  saved state copied, in one transaction. The Draft is clean afterwards, whichever
  saved state it is (ADR 0016, amendment 2026-11-16).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: isNumber
    - expression: 'res.body.has_unsaved_changes'
      operator: eq
      value: 'false'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
