info:
  name: post library releases
  type: http
  seq: 57

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/releases
  body:
    type: json
    data: |-
      {
        "commit": {{LIBRARY_RELEASE_COMMIT}},
        "note": "with the pressure gauge",
        "author": "Bruno"
      }
  auth: inherit

docs: |
  Publishes a Commit as the next Library Release (task 72_5; ADR 0021). The
  seeded library's release 1 predates Commits, so this is release 2.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '2'
    - expression: 'res.body.note'
      operator: eq
      value: '"with the pressure gauge"'
    - expression: 'res.body.origin'
      operator: eq
      value: '"commit"'
    - expression: 'res.body.author'
      operator: eq
      value: '"Bruno"'
    - expression: 'res.body.title'
      operator: eq
      value: '"Widgets of the release"'
    - expression: 'res.body.content_counts.widget_types'
      operator: gt
      value: '0'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
