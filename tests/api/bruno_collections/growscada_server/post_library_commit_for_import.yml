info:
  name: save the library draft for the import
  type: http
  seq: 56

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/commits
  body:
    type: json
    data: |-
      {
        "version": {{LIBRARY_COMMIT_VERSION}},
        "title": "Widgets for import",
        "author": "Bruno"
      }
  auth: inherit

docs: |
  A Project imports a saved state of a Library (task 85_6): the Draft is saved
  first, and the import below names this Commit. The seed's Library is already
  at saved state 1, so the Draft's change becomes saved state 2.

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("LIBRARY_IMPORT_COMMIT", res.body.number);
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '2'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
