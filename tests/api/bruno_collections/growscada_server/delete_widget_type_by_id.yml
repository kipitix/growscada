info:
  name: delete widget type by id
  type: http
  seq: 10

http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/widget-types/{{WIDGET_TYPE_ID}}
  auth: inherit

docs: |
  A Widget's WidgetType always exists: while Widgets on any Scene use this
  type the request returns `409 Conflict` Problem Details and nothing is
  deleted. Delete or retype those Widgets first.

  The delete states no version: a delete that loses a write race (the
  resource changed between reading and deleting it) is retried against the
  fresh state; one that loses it 3 times in a row returns `409 Conflict`.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
