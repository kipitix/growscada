info:
  name: delete widget type by id
  type: http
  seq: 48

http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/widget-types/{{WIDGET_TYPE_ID}}
  auth: inherit

docs: |
  Removes the WidgetType from the library's Draft. It touches no project:
  their Widgets are of the copies the releases they pin hold.

  The delete states no version: a delete that loses a write race (the
  resource changed between reading and deleting it) is retried against the
  fresh state; one that loses it 3 times in a row returns `409 Conflict`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{WIDGET_TYPE_ID}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
