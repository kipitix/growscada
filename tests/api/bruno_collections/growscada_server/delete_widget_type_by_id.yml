info:
  name: delete widget type by id
  type: http
  seq: 77
http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/widget-types/{{WIDGET_TYPE_ID}}?version=3
  auth: inherit

docs: |
  Removes the WidgetType from the library's Draft. It touches no project:
  their Widgets are of the copies the releases they pin hold.

  The delete states the Version of the library's Draft the client saw
  (`?version=`): a stale one returns `409 Conflict` (reload and retry).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{WIDGET_TYPE_ID}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
