info:
  name: delete scene by id
  type: http
  seq: 75

http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/scenes/{{SCENE_ID}}?version=8
  headers:
    - name: X-GrowSCADA-Client
      value: "{{CLIENT_KEY}}"
  auth: inherit

docs: |
  The delete states the Version of the Draft in `?version=`: a stale one returns
  `409 Conflict`. A delete that loses a write race (the
  resource changed between reading and deleting it) is retried against the
  fresh state; one that loses it 3 times in a row returns `409 Conflict`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{SCENE_ID}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
