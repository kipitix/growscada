info:
  name: delete scene by id
  type: http
  seq: 76
http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/scenes/{{SCENE_ID}}?version=8
  auth: inherit

docs: |
  The delete states the Version of the Draft in `?version=`: a stale one returns
  `409 Conflict`, its Problem carrying the Draft's current Version in
  `draft.version` (ADR 0016).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{SCENE_ID}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
