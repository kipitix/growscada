info:
  name: get project by id
  type: http
  seq: 3

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}
  auth: inherit

docs: |
  A project. Its content (tags, scenes, widgets) lives under its path,
  `/api/v0/projects/{project}/…`; a project that does not exist, or is deleted,
  answers `404` for all of it.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.name'
      operator: eq
      value: '"Main"'
    - expression: 'res.body.version'
      operator: eq
      value: '1'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
