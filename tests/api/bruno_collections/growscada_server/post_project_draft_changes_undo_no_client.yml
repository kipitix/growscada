info:
  name: post project draft changes undo without a client
  type: http
  seq: 126

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/draft-changes/undo
  body:
    type: json
    data: |-
      {
        "version": 24
      }
  auth: inherit

docs: |
  An undo is a write of the Draft, gated by its EditLock (ADR 0015): a request
  that names no client in `X-GrowSCADA-Client` is `400 Bad Request`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '400'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: 'application/problem+json'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
