info:
  name: get one project saved state with its labels
  type: http
  seq: 2017
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/saved-states/1
  auth: inherit

docs: |
  A saved state carries the labels that mark it, ordered by name ignoring case
  (task 85_3; ADR 0025): the row the history draws its chips from.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.labels.length'
      operator: eq
      value: '1'
    - expression: 'res.body.labels[0].id'
      operator: eq
      value: '"{{LABEL_ID}}"'
    - expression: 'res.body.labels[0].color'
      operator: eq
      value: '"#3b82f6"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
