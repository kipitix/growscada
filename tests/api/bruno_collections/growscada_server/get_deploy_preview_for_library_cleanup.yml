info:
  name: preview the foreign Deployment of the cleanup project
  type: http
  seq: 206

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{CLEANUP_PROJECT_ID}}/deploy/preview
  auth: inherit

docs: |
  The running Deployment names a Library Release this server does not have:
  the preview says so in `missing_releases`, so the Project mode warns that a
  Discard drops the widgets of that Release (task 71).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.missing_releases[0].library_id'
      operator: eq
      value: '"d0000000-0000-4000-8000-0000000000ff"'
    - expression: 'res.body.missing_releases[0].release'
      operator: eq
      value: '1'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
