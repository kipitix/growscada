info:
  name: get journal with an empty page
  type: http
  seq: 54

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/journal?limit=0
  auth: inherit

docs: |
  A page size outside `(0, 1000]` is the caller's input: `400 Bad Request` as
  Problem Details, before any read of the project (ADR 0019).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '400'
    - expression: 'res.headers["content-type"]'
      operator: contains
      value: 'application/problem+json'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
