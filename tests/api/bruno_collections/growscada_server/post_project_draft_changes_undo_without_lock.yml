info:
  name: post project draft changes undo without the edit lock
  type: http
  seq: 127

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/draft-changes/undo
  headers:
    - name: X-GrowSCADA-Client
      value: "{{OTHER_CLIENT_KEY}}"
  body:
    type: json
    data: |-
      {
        "version": 24
      }
  auth: inherit

docs: |
  An undo is a write of the Draft, gated by its EditLock (ADR 0015): a client
  that does not hold it is `409 Conflict`, and the Problem Details name the
  holder in its edit_lock field, so the UI shows who edits and offers a
  takeover (ADR 0017). The Version the request states is current — the lock
  refuses it before the Version is compared.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '409'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: 'application/problem+json'
    - expression: 'res.body.title'
      operator: eq
      value: '"Conflict: EditLock"'
    - expression: 'res.body.edit_lock.held'
      operator: eq
      value: 'true'
    - expression: 'res.body.edit_lock.holder.name'
      operator: eq
      value: '"bruno"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
