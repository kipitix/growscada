info:
  name: get editing lock is gone
  type: http
  seq: 180

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/edit-lock
  auth: inherit

docs: |
  The Draft is edited without a lock (ADR 0022): every editing-lock route answers
  `410 Gone` with a hint to edit and save the Draft, and is removed with the
  API 1.0. The Draft's Version is the only concurrency token.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '410'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: application/problem+json
    - expression: 'res.body.status'
      operator: eq
      value: '410'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
