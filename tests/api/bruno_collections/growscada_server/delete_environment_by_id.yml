info:
  name: delete environment by id
  type: http
  seq: 116

http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/environments/{{ENVIRONMENT_ID}}?version=21
  auth: inherit

docs: |
  Removes the Environment (200) and returns it as it was read. One that still
  holds the pairs of its Devices is refused with `409`; both pairs were removed
  just before.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{ENVIRONMENT_ID}}"'
    - expression: 'res.body.name'
      operator: eq
      value: '"bench"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
