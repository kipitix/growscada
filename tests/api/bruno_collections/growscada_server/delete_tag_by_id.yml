info:
  name: delete tag by id
  type: http
  seq: 34

http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/tags/{{TAG_ID}}
  auth: inherit

docs: |
  The delete states no version and never returns `409 Conflict`: the tag is
  deleted whatever value was written to it meanwhile. The response carries
  the tag as it was read just before the delete, with its last state; the
  state goes with it, so a value written after the delete is `404`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{TAG_ID}}"'
    - expression: 'res.body.name'
      operator: eq
      value: '"creator"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
