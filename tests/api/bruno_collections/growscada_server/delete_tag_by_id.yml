info:
  name: delete tag by id
  type: http
  seq: 4

http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/tags/{{TAG_ID}}
  auth: inherit

docs: |
  The delete states no version and never returns `409 Conflict`: the tag is
  deleted whatever value was written to it meanwhile. The response carries
  the tag as it was read just before the delete.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
