info:
  name: get a deployment as a project file
  type: http
  seq: 135

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/deployments/1/projectfile
  auth: inherit

docs: |
  The document the Runtime node stored for Deployment 1, exactly as it was
  deployed (ADR 0018). It is a download named after the deployment.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: application/json
    - expression: 'res.headers["content-disposition"]'
      operator: eq
      value: 'attachment; filename="Main-deployment-1.json"'
    - expression: 'res.body.project_id'
      operator: eq
      value: '{{PROJECT_ID}}'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
