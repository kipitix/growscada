info:
  name: get the draft before the second deploy
  type: http
  seq: 59

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/draft
  auth: inherit

docs: |
  The Draft changed since the first Deploy (a Library Pin was added): its
  Version is what the second Save states (task 72_4).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined

  scripts:
    - type: after-response
      code: |-
        bru.setVar("OTHER_DRAFT_VERSION", res.body.version)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
