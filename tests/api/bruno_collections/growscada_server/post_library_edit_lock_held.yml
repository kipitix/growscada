info:
  name: post library edit lock (held by another client)
  type: http
  seq: 78

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/libraries/{{LIBRARY_ID}}/edit-lock
  headers:
    - name: X-GrowSCADA-Client
      value: "{{OTHER_CLIENT_KEY}}"
  body:
    type: json
    data: |-
      {
        "name": "alice"
      }
  auth: inherit

docs: |
  A Check out of a Library's Draft another client holds is `409 Conflict`,
  and the Problem Details name the holder in its edit_lock field — that is
  how the UI shows who edits and offers a takeover (ADR 0015).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '409'
    - expression: 'res.headers["content-type"]'
      operator: contains
      value: application/problem+json
    - expression: 'res.body.edit_lock.held'
      operator: eq
      value: 'true'
    - expression: 'res.body.edit_lock.holder.name'
      operator: eq
      value: '"bruno"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
