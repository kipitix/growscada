info:
  name: get tag states
  type: http
  seq: 43

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/tag-states
  auth: inherit

docs: |
  The states of the Tags of the running Revision, by Tag ID: the snapshot
  Operation renders before `tag_updated` events arrive. The empty project has
  no Tags, so the snapshot is empty and carries no state to check; a project
  without a Revision answers `404`. Each state carries `seq`, the Journal
  position of its latest change, and `written_at`, when it was last written
  (absent for a state no supplier has written yet, ADR 0019).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.tag_states'
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
