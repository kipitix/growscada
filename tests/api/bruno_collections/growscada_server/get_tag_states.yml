info:
  name: get tag states
  type: http
  seq: 43

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/tag-states
  auth: inherit

docs: |
  The states of the Tags of the running Revision, by Tag ID: the snapshot
  Operation renders before `tag_updated` events arrive. The empty project has
  no Tags, so the snapshot is empty; a project without a Revision answers
  `404`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.tag_states'
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
