info:
  name: get devices
  type: http
  seq: 85
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/devices
  auth: inherit

docs: |
  The Devices of the project's Draft, in creation order (ADR 0004,
  amendment 2026-11-01). A Device says what a thing is: its protocol and the
  configuration read under it. Where it stands and how to reach it is an
  Environment Device's.

  The seeded project Main has two Devices: `sim`, which the fixture token acts
  for, and `sim-2`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.devices'
      operator: isArray
    - expression: 'res.body.devices[0].id'
      operator: eq
      value: '"{{DEVICE_ID}}"'
    - expression: 'res.body.devices[0].config'
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
