info:
  name: create the first widget for the group move
  type: http
  seq: 147

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/scenes/{{MOVE_SCENE_ID}}/widgets
  body:
    type: json
    data: |-
      {
        "name": "move-gauge-1",
        "position": { "x": 10.0, "y": 20.0, "z": 0 },
        "size": { "width": 80, "height": 80 },
        "origin": { "x": 0.5, "y": 0.5 },
        "rotation": { "degrees": 0.0 },
        "type_id": "{{WIDGET_TYPE_ID}}",
        "labels": ["move"],
        "port_bindings": [],
        "version": 27
      }
  auth: inherit

docs: |
  The first of the two widgets of one group move: `MOVE_WIDGET_ID_1` carries
  its ID, and the Version is the one the created scene answered.

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("MOVE_WIDGET_ID_1", res.body.id);
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: isString
    - expression: 'res.body.version'
      operator: eq
      value: '28'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
