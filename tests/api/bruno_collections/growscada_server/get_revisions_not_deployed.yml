info:
  name: get revisions of a never deployed project
  type: http
  seq: 40

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/revisions
  auth: inherit

docs: |
  A project that was never deployed has no Revisions: the list is `200` with
  an empty array, not `404` (`GET …/revision` stays `404` until the first
  Deploy).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.revisions'
      operator: isArray
    - expression: 'res.body.revisions.length'
      operator: eq
      value: '0'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
