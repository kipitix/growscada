info:
  name: get the cleanup draft before the second commit
  type: http
  seq: 1994
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{CLEANUP_PROJECT_ID}}/draft
  auth: inherit

docs: |
  The Version of the cleanup Draft, changed by the unpin (task 72_4).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined

  scripts:
    - type: after-response
      code: |-
        bru.setVar("CLEANUP_DRAFT_VERSION", res.body.version)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
