info:
  name: discard a Revision whose Library Releases are not here
  type: http
  seq: 143

http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/discard
  headers:
    - name: X-GrowSCADA-Client
      value: "{{CLIENT_KEY}}"
  auth: inherit

docs: |
  The running Revision was deployed from a foreign file and names a Library
  Release this server does not have: the Draft cannot hold that pin, so the
  Discard is refused with `revision_not_discardable` and the missing pins as
  `file_issues`, and the Draft is left as it is (ADR 0018).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '409'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: application/problem+json
    - expression: 'res.body.file_issues[0].path'
      operator: eq
      value: 'library_pins[0]'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
