info:
  name: get deploy preview of the deployed project
  type: http
  seq: 34

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/deploy/preview
  auth: inherit

docs: |
  The Draft is the Revision the project runs: the preview names it and says
  `unchanged`.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.current_revision.number'
      operator: eq
      value: '1'
    - expression: 'res.body.unchanged'
      operator: eq
      value: 'true'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
