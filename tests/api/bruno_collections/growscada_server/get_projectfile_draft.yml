info:
  name: get the draft as a project file
  type: http
  seq: 133

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/projectfile
  auth: inherit

docs: |
  The Draft as a ProjectFile, the same document a Deploy would send
  (ADR 0018). It is a download: `application/json`, an attachment named after
  the project, and the API's schema version staying a header. Reading it needs
  no EditLock.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: application/json
    - expression: 'res.headers["content-disposition"]'
      operator: eq
      value: 'attachment; filename="Main-draft.json"'
    - expression: 'res.body.project_id'
      operator: eq
      value: '{{PROJECT_ID}}'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
