info:
  name: get edit lock (free)
  type: http
  seq: 1

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/edit-lock
  auth: inherit

docs: |
  The state of the Draft's EditLock (ADR 0015): 200 whether it is free or held,
  so the UI knows what to show without a 404 to read. A Draft never checked out
  is free at version 0; the row of a checked-out Draft stays when it is free,
  its version growing monotonically across holders.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.held'
      operator: eq
      value: 'false'
    - expression: 'res.body.version'
      operator: eq
      value: '0'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
