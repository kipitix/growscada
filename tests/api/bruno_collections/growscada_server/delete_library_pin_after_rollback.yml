info:
  name: delete library pin after rollback
  type: http
  seq: 54

http:
  method: DELETE
  url: http://{{API_SERVER}}/api/v0/projects/{{OTHER_PROJECT_ID}}/library-pins/{{OTHER_LIBRARY_ID}}
  auth: inherit

docs: |
  Returns the Draft of the project to the document the Rollback made it run:
  the pin the Deploy before added goes, so the next requests of the
  collection see the project as it was before this section.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.library_id'
      operator: eq
      value: '"{{OTHER_LIBRARY_ID}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
