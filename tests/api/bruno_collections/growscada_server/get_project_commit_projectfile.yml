info:
  name: download the project file of a commit
  type: http
  seq: 160
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/commits/2/projectfile
  auth: inherit

docs: |
  The canonical ProjectFile the Commit fixed, as a download: the snapshot is
  the document a Deploy of that Draft would have sent (task 72_2; ADR 0021).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.headers["content-type"]'
      operator: eq
      value: application/json
    - expression: 'res.body.project_id'
      operator: eq
      value: '{{PROJECT_ID}}'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
