info:
  name: put widget by id
  type: http
  seq: 21

http:
  method: PUT
  url: http://{{API_SERVER}}/api/v0/scenes/{{SCENE_ID}}/widgets/{{WIDGET_ID}}
  body:
    type: json
    data: |-
      {
        "name": "status-circle-updated",
        "position": { "x": 150.0, "y": 250.0, "z": 1 },
        "size": { "width": 80, "height": 80 },
        "origin": { "x": 0.5, "y": 0.5 },
        "rotation": { "degrees": 45.0 },
        "type_id": "{{WIDGET_TYPE_ID}}",
        "labels": ["indicator", "status", "updated"],
        "port_bindings": [
          { "port_name": "state", "tag_id": "{{BOOLEAN_TAG_ID}}" }
        ],
        "scene_version": 2
      }
  auth: inherit

docs: |
  The versions in this collection's bodies follow its run order (`seq`) on
  the seed data: each Widget change raises its Scene's version (1 → post
  widgets → 2 → put widget → 3 → put scene → 4).

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.scene_version'
      operator: eq
      value: '3'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
