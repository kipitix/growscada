info:
  name: put widget by id
  type: http
  seq: 68

http:
  method: PUT
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/scenes/{{SCENE_ID}}/widgets/{{WIDGET_ID}}
  headers:
    - name: X-GrowSCADA-Client
      value: "{{CLIENT_KEY}}"
  body:
    type: json
    data: |-
      {
        "name": "status-circle-updated",
        "position": { "x": 150.0, "y": 250.0, "z": 1 },
        "size": { "width": 80, "height": 80 },
        "origin": { "x": 0.5, "y": 0.5 },
        "rotation": { "degrees": 45.0 },
        "type_id": "{{WIDGET_TYPE_ID}}",
        "labels": ["indicator", "status", "updated"],
        "port_bindings": [
          { "port_name": "state", "tag_id": "{{BOOLEAN_TAG_ID}}" }
        ],
        "version": 5
      }
  auth: inherit

docs: |
  `version` is the Version of the Project's Draft (ADR 0016): every write of
  the Draft's content states it and raises it by one, and the collection's
  bodies follow its run order (`seq`) on the seed data.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.version'
      operator: eq
      value: '6'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
