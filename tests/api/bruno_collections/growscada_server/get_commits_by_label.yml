info:
  name: get the project commits of one label
  type: http
  seq: 2016
http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/commits?label={{LABEL_ID}}
  auth: inherit

docs: |
  The history narrowed to the saved states the label marks, newest first
  (task 85_3; ADR 0025). The filter is part of the query, not of the client.
  One saved state carries the label: saved state 1.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.commits.length'
      operator: eq
      value: '1'
    - expression: 'res.body.commits[0].number'
      operator: eq
      value: '1'
    - expression: 'res.body.commits[0].labels[0].id'
      operator: eq
      value: '"{{LABEL_ID}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
