info:
  name: deploy a file for the project file downloads
  type: http
  seq: 135
http:
  method: POST
  url: http://{{API_SERVER}}/api/v0/projects/{{PROJECT_ID}}/projectfile/deploy
  body:
    type: json
    data: |-
      {
        "schema_version": "0.2",
        "project_id": "{{PROJECT_ID}}"
      }
  auth: inherit

docs: |
  A file is published as a Release with origin file and becomes the project's
  first Deployment (task 72_4), so its Deployments have a document to download
  (ADR 0018). The Draft is unchanged by the Deploy.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '201'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.number'
      operator: eq
      value: '2'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
