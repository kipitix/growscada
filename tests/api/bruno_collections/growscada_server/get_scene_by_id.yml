info:
  name: get scene by id
  type: http
  seq: 9

http:
  method: GET
  url: http://{{API_SERVER}}/api/v0/scenes/{{SCENE_ID}}
  auth: inherit

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.headers["growscada-schema-version"]'
      operator: isDefined
    - expression: 'res.body.id'
      operator: eq
      value: '"{{SCENE_ID}}"'
    - expression: 'res.body.name'
      operator: eq
      value: '"Main Dashboard"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
