info:
  name: put widget type by id
  type: http
  seq: 9

http:
  method: PUT
  url: http://{{API_SERVER}}/api/v1/widget-types/{{WIDGET_TYPE_ID}}
  body:
    type: json
    data: |-
      {
        "name": "pressure gauge updated",
        "html_template": "<div class=\"gauge updated\"><span class=\"value\"></span></div>",
        "script": "function update(inputs) { document.querySelector('.value').textContent = inputs.pressure + ' bar'; }",
        "script_language": "javascript",
        "default_width": 200,
        "default_height": 200,
        "input_ports": [
          { "name": "pressure", "description": "Line pressure in bar", "type_hint": "integer" },
          { "name": "temperature", "description": "Fluid temperature", "type_hint": "integer" }
        ],
        "version": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
