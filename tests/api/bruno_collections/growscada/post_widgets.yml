info:
  name: post widgets
  type: http
  seq: 18

http:
  method: POST
  url: http://{{API_SERVER}}/api/v1/widgets
  body:
    type: json
    data: |-
      {
        "name": "status-circle",
        "position": { "x": 100.0, "y": 200.0, "z": 0 },
        "size": { "width": 80, "height": 80 },
        "origin": { "x": 0.5, "y": 0.5 },
        "rotation": { "degrees": 0.0 },
        "type_id": "{{WIDGET_TYPE_ID}}",
        "scene_id": "{{SCENE_ID}}",
        "labels": ["indicator", "status"],
        "port_bindings": [
          { "port_name": "state", "tag_id": "{{TAG_ID}}" }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
