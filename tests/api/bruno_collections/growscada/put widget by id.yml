info:
  name: put widget by id
  type: http
  seq: 19

http:
  method: PUT
  url: http://{{API_SERVER}}/api/v1/widgets/{{WIDGET_ID}}
  body:
    type: json
    data: |-
      {
        "name": "pressure-gauge-updated",
        "coordinates": { "x": 150.0, "y": 250.0, "z": 1.0 },
        "type_id": "{{WIDGET_TYPE_ID}}",
        "scene_id": "{{SCENE_ID}}",
        "labels": ["sensor", "pressure", "updated"],
        "tag_ids": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
