info:
  name: post widget types
  type: http
  seq: 7

http:
  method: POST
  url: http://{{API_SERVER}}/api/v1/widget-types
  body:
    type: json
    data: |-
      {
        "name": "pressure gauge",
        "html_template": "<div class=\"gauge\"><span class=\"value\"></span></div>",
        "script": "function render(inputs) { document.querySelector('.value').textContent = inputs.pressure; }",
        "script_language": "javascript",
        "default_width": 150,
        "default_height": 150,
        "input_ports": [
          { "name": "pressure", "description": "Line pressure in bar", "type_hint": "integer" }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
