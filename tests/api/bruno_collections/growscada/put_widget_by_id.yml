info:
  name: put widget by id
  type: http
  seq: 19

http:
  method: PUT
  url: http://{{API_SERVER}}/api/v1/widgets/{{WIDGET_ID}}
  body:
    type: json
    data: |-
      {
        "name": "status-circle-updated",
        "position": { "x": 150.0, "y": 250.0, "z": 1 },
        "size": { "width": 80, "height": 80 },
        "origin": { "x": 0.5, "y": 0.5 },
        "rotation": { "degrees": 45.0 },
        "type_id": "{{WIDGET_TYPE_ID}}",
        "scene_id": "{{SCENE_ID}}",
        "labels": ["indicator", "status", "updated"],
        "port_bindings": [
          { "port_name": "state", "tag_id": "{{TAG_ID}}" }
        ],
        "version": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
