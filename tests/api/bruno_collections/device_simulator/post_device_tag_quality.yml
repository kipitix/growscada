info:
  name: post device tag quality
  type: http
  seq: 5

http:
  method: POST
  url: http://{{CONTROL_SERVER}}/control/device/tags/{{TAG_NAME}}/quality
  body:
    type: json
    data: |-
      {
        "quality": "bad"
      }
  auth: inherit

docs: |
  Override the tag's quality (good, uncertain, bad) on every write until reset.
  Written to the server right away if the device is running.
  While the device is still connecting to the server this is 503.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
