info:
  name: post device stop
  type: http
  seq: 2

http:
  method: POST
  url: http://{{CONTROL_SERVER}}/control/device/stop
  auth: inherit

docs: |
  Pause writing; the process and the control API stay up. Idempotent.
  Answers once the writes already on their way to the server are done: from
  then on the device is silent.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.body.running'
      operator: eq
      value: 'false'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
