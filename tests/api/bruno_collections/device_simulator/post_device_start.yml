info:
  name: post device start
  type: http
  seq: 3

http:
  method: POST
  url: http://{{CONTROL_SERVER}}/control/device/start
  auth: inherit

docs: |
  Resume writing. Pattern time continues where stop left it. Idempotent.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.body.running'
      operator: eq
      value: 'true'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
