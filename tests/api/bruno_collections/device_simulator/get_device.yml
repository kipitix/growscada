info:
  name: get device
  type: http
  seq: 1

http:
  method: GET
  url: http://{{CONTROL_SERVER}}/control/device
  auth: inherit

docs: |
  Snapshot of the simulated Device: state ("connecting" until its
  configuration is read on the server, then "connected"), the Device and
  Environment the token and the config name, running flag and, per tag, its
  type (empty while connecting), interval, current quality (overridden or
  configured), the "overridden" flag, pattern and "lost" (the Device no longer
  supplies the tag: it was deleted on the server or taken out of the Device's
  configuration). The control API is up from the start, before the server is
  reachable.

runtime:
  assertions:
    - expression: 'res.status'
      operator: eq
      value: '200'
    - expression: 'res.body.state'
      operator: eq
      value: '"connected"'
    - expression: 'res.body.device_name'
      operator: eq
      value: '"gateway"'
    - expression: 'res.body.environment'
      operator: eq
      value: '"lab"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
