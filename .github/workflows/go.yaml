name: Go CI

on:
  push:
    branches: [path]
  pull_request:
    branches: [path]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Build
        run: make build

  bruno:
    # The Bruno collections against the application in containers
    # (tests/api/docker-compose.yaml); the runner has Docker and Node.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Run the Bruno collections
        run: make bruno_test
