services:
  db:
    image: postgres:18 # Specifies the PostgreSQL image and version
    restart: always # Ensures the container restarts automatically
    environment:
      POSTGRES_DB: growscada # Sets the default database name
      POSTGRES_USER: growscada # Sets the default username
      POSTGRES_PASSWORD: growscada # Sets the password for the user
    ports:
      - "5432:5432" # Maps host port 5432 to container port 5432
    volumes:
      - growscada_data:/var/lib/postgresql/data # Mounts a named volume for persistent data storage
volumes:
  growscada_data: # Defines the named volume
